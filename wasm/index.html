<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        PHP WASM
    </title>

    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "Noto Sans", sans-serif;
            background: linear-gradient(180deg, #f6f7fb 0%, #eef2ff 100%);
            color: #172554;
        }

        .loader {
            width: min(560px, 92vw);
            background: #ffffff;
            border: 1px solid #dbe3ff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.12);
        }

        .title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .status {
            margin: 10px 0 12px;
            font-size: 14px;
            color: #334155;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: #dbeafe;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2563eb 0%, #06b6d4 100%);
            transition: width 160ms linear;
        }

        .meta {
            margin-top: 8px;
            font-size: 12px;
            color: #475569;
        }
    </style>

</head>


<body>

    <section class="loader" aria-live="polite">
        <h1 class="title">Preparing PHP WASM</h1>
        <p class="status" id="status">Registering Service Worker...</p>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-bar" id="bar"></div>
        </div>
        <p class="meta" id="meta">0%</p>
    </section>


    <script type="module">

        const statusElement = document.getElementById("status");
        const progressBarElement = document.getElementById("bar");
        const progressMetaElement = document.getElementById("meta");
        const progressTrackElement = document.querySelector("[role='progressbar']");

        function setProgress(progress, message) {

            const normalized = Math.max(0, Math.min(100, Number(progress) || 0));

            progressBarElement.style.width = `${normalized}%`;
            progressMetaElement.textContent = `${normalized}%`;
            progressTrackElement.setAttribute("aria-valuenow", String(normalized));

            if (message) {
                statusElement.textContent = message;
            }
        }

        function waitForController(timeoutMs = 8000) {

            if (navigator.serviceWorker.controller) {
                return Promise.resolve(true);
            }

            return new Promise(resolve => {
                const timer = setTimeout(() => resolve(false), timeoutMs);

                navigator.serviceWorker.addEventListener("controllerchange", () => {
                    clearTimeout(timer);
                    resolve(true);
                }, { once: true });
            });
        }

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.addEventListener("message", event => {

                const data = event.data;

                if (!data || data.type !== "wasm-bootstrap-progress") {
                    return;
                }

                setProgress(data.progress, data.message);
            });

            await navigator.serviceWorker.register(
                "/service-worker.mjs",
                {
                    type: "module",
                    updateViaCache: "none"
                }
            );

            console.log("PHP WASM service worker registered");
            setProgress(2, "Waiting for Service Worker control...");

            if (!navigator.serviceWorker.controller) {

                const hasController = await waitForController();

                if (hasController) {
                    setProgress(100, "Ready, opening the application...");
                    location.reload();
                } else {
                    statusElement.textContent = "Service Worker active, waiting for runtime installation...";
                }

            } else {

                setProgress(100, "Opening the application...");
                location.reload();

            }

        } else {

            statusElement.textContent = "Your browser does not support Service Worker.";

        }

    </script>


</body>

</html>
